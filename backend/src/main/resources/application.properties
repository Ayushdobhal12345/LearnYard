spring.config.import=optional:application-secrets.properties

spring.application.name=ila

spring.datasource.url=jdbc:postgresql://localhost:5432/ila_db
spring.datasource.username=postgres
# password now comes from application-secrets.properties

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

server.port=8080
app.upload.dir=./uploads/study-materials

# pinecone.api-key, pinecone.index-name now come from application-secrets.properties
pinecone.index-name=ila-study-materials

spring.ai.google.genai.chat.options.model=gemini-3.6-flash
spring.ai.google.genai.chat.options.include-thoughts=true
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768
# spring.ai.google.genai.api-key and embedding.api-key now come from application-secrets.properties